name: build-windows-mingw
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'

concurrency: ci-windows-mingw-${{ github.ref }}

jobs:

  windows-mingw:

    runs-on: windows-latest

    name: MSYS2 (${{ matrix.msystem }} ${{ matrix.mpi }} MPI, ${{ matrix.dependencies }} dependencies)

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        msystem: [UCRT64]
        dependencies: [bundled, external]
        mpi: [with, without]
        include:
          - dependencies: external
            external-packages: parpack:p
            external-cmake-flags: -DEXTERNAL_UMFPACK=ON -DEXTERNAL_ARPACK=ON -DEXTERNAL_PARPACK=ON

    steps:
      - name: get CPU name
        shell: pwsh
        run : |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name

      - name: checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: unshallow Zoltan submodule
        shell: bash
        run: git -C contrib/Zoltan_v3.83 fetch --unshallow 2>/dev/null || true

      - name: install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            ${{ matrix.mpi == 'with' && 'msmpi:p' || 'openblas:p' }}
            openblas:p
            ${{ matrix.mpi == 'with' && 'parmetis:p' || 'openblas:p' }}
            mumps:p
            suitesparse:p
            ${{ matrix.external-packages }}

      - name: install MSMPI
        if: matrix.mpi == 'with'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: configure
        # Downgrade incompatible-pointer-types to a warning to work around
        # build error of Zoltan with newer GCC.
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          declare -a _extra_config
          if [ "${{ matrix.mpi }}" == "with" ]; then
            _extra_config+=("-DWITH_MPI=ON"
                            "-DMPI_TEST_MAXPROC=$(nproc)"
                            "-DMPIEXEC_EXECUTABLE=$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe"
                            "-DWITH_Zoltan=ON"
                            "-DWITH_ElmerIce=ON"
                            "-DParMetis_LIBRARIES=$(pkg-config --libs parmetis)"
                            "-DParMetis_INCLUDE_DIR=$(pkg-config --cflags parmetis)"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dmo mumps-zmo mumps-smo mumps-cmo)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dmo mumps-zmo mumps-smo mumps-cmo)")
          else
            _extra_config+=("-DWITH_MPI=OFF"
                            "-DWITH_Zoltan=OFF"
                            "-DWITH_ElmerIce=OFF"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dto mumps-zto mumps-sto mumps-cto)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dto mumps-zto mumps-sto mumps-cto)")
          fi
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            "${_extra_config[@]}" \
            -DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DWITH_ELMERGUI=OFF \
            -DWITH_QT6=OFF \
            -DWITH_VTK=OFF \
            -DWITH_OCC=OFF \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=OFF \
            -DCREATE_PKGCONFIG_FILE=ON \
            ${{ matrix.external-cmake-flags }} \
            ..

      - name: exclude build output from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build .

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      # TEMPORARY (no-threadprivate branch diagnostic, revert when investigation
      # is closed): instead of the usual stress loop, hunt specifically for the
      # intermittent Step_stokes_heat_vec InvertMatrix (bubble-condensation)
      # failure, with ELMER_DEBUG_CONDENSATE=1 dumping each element's bubble
      # submatrix so the failing matrix can be diffed against the immediately
      # preceding passing one. Stops as soon as that specific failure is
      # caught; a norm-mismatch failure (the other known flake) is logged but
      # does not stop the loop. Restore the normal 100-iteration stress test
      # (see git history) once done.
      - name: check
        id: run-ctest
        timeout-minutes: 150
        run: |
          cd ${GITHUB_WORKSPACE}/build
          export ELMER_DEBUG_CONDENSATE=1
          testdir=fem/tests/Step_stokes_heat_vec
          mkdir -p condensate_artifacts
          max_iter=300
          found=0
          for i in $(seq 1 "$max_iter"); do
            rm -f "${testdir}/condensate_debug.log"
            if ctest . -R "^Step_stokes_heat_vec\$" --timeout 60 --output-on-failure \
                > condensate_artifacts/iter_out.log 2>&1; then
              [ -f "${testdir}/condensate_debug.log" ] && \
                cp "${testdir}/condensate_debug.log" condensate_artifacts/last_pass.log
            else
              echo "--- iteration $i failed ---"
              cat condensate_artifacts/iter_out.log
              cp condensate_artifacts/iter_out.log "condensate_artifacts/fail_iter_${i}_output.log"
              [ -f "${testdir}/condensate_debug.log" ] && \
                cp "${testdir}/condensate_debug.log" "condensate_artifacts/fail_iter_${i}.log"
              if grep -qiE "InvertMatrix|Matrix is singular|LU-decomposition" condensate_artifacts/iter_out.log; then
                echo "Caught InvertMatrix failure at iteration $i"
                [ -f condensate_artifacts/last_pass.log ] && \
                  cp condensate_artifacts/last_pass.log condensate_artifacts/matched_pass.log
                found=1
                break
              else
                echo "Non-InvertMatrix failure at iteration $i (likely the norm-mismatch mode); continuing"
              fi
            fi
          done
          rm -f condensate_artifacts/iter_out.log
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" -eq 1 ]; then
            echo "SUCCESS: captured a matched pass/fail bubble-matrix pair"
          else
            echo "Did not reproduce an InvertMatrix failure in $max_iter iterations"
          fi
          test "$found" -eq 1

      - name: upload condensate debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condensate-debug-logs-${{ matrix.dependencies }}-${{ matrix.mpi }}
          path: build/condensate_artifacts/
          if-no-files-found: warn
