name: debug-condensate-windows
# Temporary diagnostic workflow: loop Step_stokes_heat_vec on Windows until an
# InvertMatrix (bubble-condensation) failure is caught, then archive the
# instrumented bubble-matrix dump from that failing run alongside the dump
# from the immediately preceding passing run, for a bit-for-bit comparison.
# Triggered manually only. Remove once the investigation is closed out.
on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Max test iterations before giving up'
        required: false
        default: '300'

concurrency: ci-debug-condensate-windows-${{ github.ref }}

jobs:

  debug-condensate:

    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: unshallow Zoltan submodule
        shell: bash
        run: git -C contrib/Zoltan_v3.83 fetch --unshallow 2>/dev/null || true

      - name: install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            openblas:p
            mumps:p
            suitesparse:p

      - name: configure
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            -DWITH_MPI=OFF \
            -DWITH_Zoltan=OFF \
            -DWITH_ElmerIce=OFF \
            -DWITH_Mumps=ON \
            -DMumps_LIBRARIES=$(pkg-config --libs mumps-dto mumps-zto mumps-sto mumps-cto) \
            -DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dto mumps-zto mumps-sto mumps-cto) \
            -DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DWITH_ELMERGUI=OFF \
            -DWITH_QT6=OFF \
            -DWITH_VTK=OFF \
            -DWITH_OCC=OFF \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=OFF \
            -DCREATE_PKGCONFIG_FILE=ON \
            ..

      - name: exclude build output from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build .

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      # Loop the failing test only, with the bubble-condensation dump enabled,
      # until we catch one InvertMatrix (singular-matrix) failure. The dump
      # from the immediately preceding passing iteration is kept alongside it
      # so the two bubble matrices for the same physical element can be diffed.
      - name: hunt InvertMatrix failure
        id: hunt
        timeout-minutes: 120
        run: |
          cd ${GITHUB_WORKSPACE}/build
          export ELMER_DEBUG_CONDENSATE=1
          testdir=fem/tests/Step_stokes_heat_vec
          mkdir -p condensate_artifacts
          max_iter=${{ github.event.inputs.max_iterations }}
          found=0
          for i in $(seq 1 "$max_iter"); do
            rm -f "${testdir}/condensate_debug.log"
            if ctest . -R "^Step_stokes_heat_vec\$" --timeout 60 --output-on-failure \
                > condensate_artifacts/iter_out.log 2>&1; then
              # Passing iteration: keep only the most recent dump as the "last known good".
              [ -f "${testdir}/condensate_debug.log" ] && \
                cp "${testdir}/condensate_debug.log" condensate_artifacts/last_pass.log
            else
              echo "--- iteration $i failed ---"
              cat condensate_artifacts/iter_out.log
              cp condensate_artifacts/iter_out.log "condensate_artifacts/fail_iter_${i}_output.log"
              [ -f "${testdir}/condensate_debug.log" ] && \
                cp "${testdir}/condensate_debug.log" "condensate_artifacts/fail_iter_${i}.log"
              if grep -qiE "InvertMatrix|Matrix is singular|LU-decomposition" condensate_artifacts/iter_out.log; then
                echo "Caught InvertMatrix failure at iteration $i"
                [ -f condensate_artifacts/last_pass.log ] && \
                  cp condensate_artifacts/last_pass.log condensate_artifacts/matched_pass.log
                found=1
                break
              else
                echo "Non-InvertMatrix failure at iteration $i (likely the norm-mismatch mode); continuing"
              fi
            fi
          done
          rm -f condensate_artifacts/iter_out.log
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" -eq 1 ]; then
            echo "SUCCESS: captured a matched pass/fail bubble-matrix pair"
          else
            echo "Did not reproduce an InvertMatrix failure in $max_iter iterations"
          fi

      - name: upload condensate debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condensate-debug-logs
          path: build/condensate_artifacts/
          if-no-files-found: warn
