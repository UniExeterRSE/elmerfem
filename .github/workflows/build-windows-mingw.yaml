name: build-windows-mingw
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'

concurrency: ci-windows-mingw-${{ github.ref }}

jobs:

  windows-mingw:

    runs-on: windows-latest

    name: MSYS2 (${{ matrix.msystem }} ${{ matrix.mpi }} MPI)

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      fail-fast: false

      matrix:
        msystem: [UCRT64]
        mpi: [with, without]

    steps:
      - name: get CPU name
        shell: pwsh
        run : |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name

      - name: checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            ${{ matrix.mpi == 'with' && 'msmpi:p' || 'openblas:p' }}
            openblas:p
            ${{ matrix.mpi == 'with' && 'parmetis:p' || 'openblas:p' }}
            mumps:p
            suitesparse:p

      - name: install MSMPI
        if: matrix.mpi == 'with'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: configure
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          declare -a _extra_config
          if [ "${{ matrix.mpi }}" == "with" ]; then
            _extra_config+=("-DWITH_MPI=ON"
                            "-DMPI_TEST_MAXPROC=$(nproc)"
                            "-DMPIEXEC_EXECUTABLE=$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe"
                            "-DWITH_Zoltan=OFF"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dmo mumps-zmo mumps-smo mumps-cmo)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dmo mumps-zmo mumps-smo mumps-cmo)")
          else
            _extra_config+=("-DWITH_MPI=OFF"
                            "-DWITH_Zoltan=OFF"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dto mumps-zto mumps-sto mumps-cto)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dto mumps-zto mumps-sto mumps-cto)")
          fi
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            "${_extra_config[@]}" \
            -DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DWITH_ElmerIce=OFF \
            -DWITH_ELMERGUI=OFF \
            -DWITH_MATC=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            ..

      - name: exclude build output from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build .

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      - name: check
        id: run-ctest
        timeout-minutes: 30
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -R FilmFlow2DFsi \
            --timeout 120
